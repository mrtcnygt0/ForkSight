<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #12141d;
        --card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.07);
        --accent: #f5c542;
        --text: #eceef4;
        --text-muted: #9ba0aa;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 320px;
        padding: 16px;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
      }
      .popup-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .popup-logo { font-size: 22px; }
      .popup-brand { font-size: 15px; font-weight: 800; }
      .popup-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
      .status {
        padding: 8px 10px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 12px;
        font-weight: 500;
        text-align: center;
      }
      .status.ok { background: rgba(61, 214, 140, 0.12); color: #3dd68c; }
      .status.fail { background: rgba(255, 107, 107, 0.12); color: #ff6b6b; }
      .status.checking { background: rgba(255, 255, 255, 0.04); color: var(--text-muted); }
      .user-info { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
      .section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .cta {
        display: block;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #12141d;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        font-family: var(--font);
      }
      .hint { font-size: 11px; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }
      .lang-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
      }
      .lang-row select {
        background: #1a1d28;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 12px;
      }
      .admin-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
      }
      .ver {
        font-size: 10px;
        color: #4b5563;
        text-align: center;
        margin-top: 10px;
      }
      #statsSection, #quotaSection { display: none !important; }
    </style>
  </head>
  <body>
    <div class="popup-header">
      <span class="popup-logo">♞</span>
      <div>
        <div class="popup-brand">ForkSight</div>
        <div class="popup-sub" id="brandSub">Personal chess coach</div>
      </div>
    </div>
    <div id="status" class="status checking">Checking server…</div>
    <div id="userInfo" class="user-info" style="display: none"></div>

    <div class="section">
      <button class="cta" id="openCoachHint" type="button">Open ForkSight on Chess.com</button>
      <div class="hint" id="openHint">
        On Chess.com, click your avatar to open Home, Coach, and Training.
      </div>
    </div>

    <div class="section" id="statsSection" style="display: none">
      <div class="grid" id="statsGrid"></div>
    </div>
    <div class="section" id="quotaSection" style="display: none">
      <div id="quotaList"></div>
      <a id="quotaUpgrade" href="#" style="display: none"></a>
    </div>

    <div class="section">
      <div class="lang-row">
        <span id="langTitle">Dil</span>
        <select id="langSelect">
          <option value="tr">Türkçe</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div id="adminSection" style="display: none">
      <span class="admin-link" id="adminLink">Admin Paneli</span>
    </div>
    <div class="ver" id="verInfo"></div>
    <script src="popup.js"></script>
  </body>
</html>
