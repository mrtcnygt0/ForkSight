<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* ─── Design Token System ─── */
      :root {
        --bg: #0b0f17;
        --card: #111827;
        --border: rgba(255, 255, 255, 0.07);
        --accent: #22c55e;
        --accent-hover: #16a34a;
        --danger: #ef4444;
        --text: #e5e7eb;
        --text-muted: #6b7280;
        --text-dim: #9ca3af;
        --font: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 340px;
        padding: 16px;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
      }

      h2 {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status {
        padding: 8px 10px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 12px;
        font-weight: 500;
        text-align: center;
      }
      .status.ok {
        background: rgba(34, 197, 94, 0.1);
        color: #4ade80;
      }
      .status.fail {
        background: rgba(239, 68, 68, 0.1);
        color: #f87171;
      }
      .status.checking {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-muted);
      }

      .section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .section h3 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 10px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        padding: 4px 0;
      }
      .row .lbl {
        color: var(--text-muted);
      }
      .row .val {
        color: var(--text);
        font-weight: 600;
      }

      label {
        font-size: 12px;
        color: var(--text-muted);
        display: block;
        margin-bottom: 5px;
      }

      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        background: #1f2937;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--font);
        outline: none;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus {
        border-color: var(--accent);
      }

      .btn {
        display: block;
        width: 100%;
        padding: 9px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        font-family: var(--font);
        cursor: pointer;
        text-align: center;
        margin-top: 8px;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }

      .shortcuts {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .shortcuts div {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
        font-size: 12px;
        color: var(--text-muted);
      }
      .shortcuts kbd {
        background: var(--accent);
        color: #fff;
        padding: 1px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
      }
      .stat {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 6px;
        text-align: center;
      }
      .stat .v {
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
      }
      .stat .l {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 3px;
      }

      .user-info {
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 8px;
      }
      .admin-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
      }
      .ver {
        font-size: 10px;
        color: #4b5563;
        text-align: center;
        margin-top: 10px;
      }

      .lang-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
      }
      .lang-row select {
        background: #1f2937;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 12px;
        font-family: var(--font);
        outline: none;
        cursor: pointer;
      }

      /* ─── FAZ 7: Popup Header ─── */
      .popup-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .popup-logo {
        font-size: 26px;
        line-height: 1;
        flex-shrink: 0;
      }
      .popup-brand {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.2;
      }
      .popup-sub {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 1px;
        letter-spacing: 0.3px;
      }
      .popup-platform {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        color: var(--accent);
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.25);
        border-radius: 20px;
        padding: 3px 8px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!-- FAZ 7: Yeni Header -->
    <div class="popup-header">
      <span class="popup-logo">♟</span>
      <div>
        <div class="popup-brand">ForkSight</div>
        <div class="popup-sub">Realtime Chess Intelligence</div>
      </div>
      <span class="popup-platform">Lichess</span>
    </div>
    <div id="status" class="status checking">Sunucu kontrol ediliyor…</div>
    <div id="userInfo" class="user-info" style="display: none"></div>

    <div class="section" id="settingsSection" hidden style="display: none">
      <h3 id="settingsTitle">⚙️ Sunucu Ayarları</h3>
      <label id="urlLabel">Sunucu URL:</label>
      <input
        type="text"
        id="apiUrl"
        placeholder="https://forksight.net"
      />
      <button class="btn" id="saveUrl" style="margin-top: 6px">
        💾 Kaydet
      </button>
    </div>

    <div class="section" id="statsSection" style="display: none">
      <h3 id="statsTitle">📊 Sunucu Durumu</h3>
      <div class="grid" id="statsGrid"></div>
    </div>

    <div class="section">
      <h3 id="shortcutsTitle">⌨️ Kısayollar</h3>
      <div class="shortcuts">
        <div><span id="scAnalyze">Analiz</span><kbd>F2</kbd></div>
        <div><span id="scClear">Temizle</span><kbd>F3</kbd></div>
        <div><span id="scSafe">Gizle</span><kbd>F4</kbd></div>
      </div>
    </div>

    <div class="section">
      <div class="lang-row">
        <span id="langTitle">🌐 Dil</span>
        <select id="langSelect">
          <option value="tr">Türkçe</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div id="adminSection" style="display: none">
      <span class="admin-link" id="adminLink">🔧 Admin Paneli</span>
    </div>

    <div class="ver" id="verInfo"></div>

    <script src="popup.js"></script>
  </body>
</html>
